name: Build Dr. iRepair RustDesk

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Client
    runs-on: windows-2022
    steps:
      - name: Checkout custom repository
        uses: actions/checkout@v4

      - name: Clone RustDesk repository
        run: |
          git clone --recurse-submodules --depth 1 https://github.com/rustdesk/rustdesk.git rustdesk-src

      - name: Inject Dr. iRepair Banner
        shell: bash
        run: |
          mkdir -p rustdesk-src/flutter/assets/images
          if [ -f "privacy_banner.png" ]; then
            cp privacy_banner.png rustdesk-src/flutter/assets/images/
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install System Dependencies & Codegen
        run: |
          choco install ninja nasm yasm -y
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features structopt
          echo "$HOME/.cargo/bin" >> $env:GITHUB_PATH
          echo "C:\Users\runneradmin\.cargo\bin" >> $env:GITHUB_PATH
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          cd C:\vcpkg
          vcpkg install opus:x64-windows-static libvpx:x64-windows-static libyuv:x64-windows-static aom:x64-windows-static

      - name: Build Windows Executable
        shell: cmd
        run: |
          cd rustdesk-src
          flutter_rust_bridge_codegen --rust-input src/flutter_ffi.rs --dart-output flutter/lib/generated_bridge.dart --rust-output src/bridge_generated.rs
          python build.py --flutter

      - name: Upload Dr. iRepair Executable
        uses: actions/upload-artifact@v4
        with:
          name: Dr_iRepair_Suporte_Windows
          path: |
            rustdesk-src/target/release/rustdesk.exe
            rustdesk-src/build/windows/runner/Release/*
